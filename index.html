//CORE-START
const SVC={21:'FTP',22:'SSH',23:'Telnet',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',143:'IMAP',443:'HTTPS',445:'SMB',3306:'MySQL',3389:'RDP',8080:'HTTP-alt'};
const ip4=(b,o)=>b[o]+'.'+b[o+1]+'.'+b[o+2]+'.'+b[o+3];
const ip6=(v,o)=>Array.from({length:8},(_,i)=>v.getUint16(o+i*2).toString(16)).join(':');
const PL=new Set([21,23,53,80,8080]);
function l4(r,b,v,o,pr){
  let po=0;
  if(pr===6&&b.length>=o+20){r.proto='TCP';r.sp=v.getUint16(o);r.dp=v.getUint16(o+2);r.fl=b[o+13];po=o+(b[o+12]>>4)*4}
  else if(pr===17&&b.length>=o+8){r.proto='UDP';r.sp=v.getUint16(o);r.dp=v.getUint16(o+2);po=o+8}
  else if(pr===1||pr===58)r.proto='ICMP';
  if(po&&po<b.length&&(PL.has(r.sp)||PL.has(r.dp)))r.pl=String.fromCharCode.apply(null,b.subarray(po,Math.min(b.length,po+300)));
  return r;
}
function decode(b,link,len){
  const r={len,proto:'Other'};let o=0,et;
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(link===1){if(b.length<14)return r;et=v.getUint16(12);o=14;while(et===0x8100&&b.length>=o+4){et=v.getUint16(o+2);o+=4}}
  else if(link===113){if(b.length<16)return r;et=v.getUint16(14);o=16}
  else if(link===101||link===12){et=(b[0]>>4)===6?0x86dd:0x0800}
  else return r;
  if(et===0x0806){r.proto='ARP';if(b.length>=o+28){r.op=v.getUint16(o+6);r.mac=Array.from(b.subarray(o+8,o+14),x=>x.toString(16).padStart(2,'0')).join(':');r.src=ip4(b,o+14);r.dst=ip4(b,o+24)}return r}
  if(et===0x0800){if(b.length<o+20)return r;const ihl=(b[o]&15)*4,pr=b[o+9];r.src=ip4(b,o+12);r.dst=ip4(b,o+16);return l4(r,b,v,o+ihl,pr)}
  if(et===0x86dd){if(b.length<o+40)return r;r.src=ip6(v,o+8);r.dst=ip6(v,o+24);return l4(r,b,v,o+40,b[o+6])}
  return r;
}
function parse(buf){
  if(buf.byteLength<24)throw Error('file too short');
  const dv=new DataView(buf),m=dv.getUint32(0,false);let le,nano=false;
  if(m===0xa1b2c3d4)le=false;else if(m===0xd4c3b2a1)le=true;
  else if(m===0xa1b23c4d){le=false;nano=true}else if(m===0x4d3cb2a1){le=true;nano=true}
  else if(m===0x0a0d0d0a)throw Error('pcapng not supported yet; convert with editcap -F pcap');
  else throw Error('not a pcap file');
  const link=dv.getUint32(20,le)&0x0fffffff,pk=[];let o=24;
  while(o+16<=buf.byteLength){
    const s=dv.getUint32(o,le),u=dv.getUint32(o+4,le),cl=dv.getUint32(o+8,le),ol=dv.getUint32(o+12,le);
    o+=16;if(o+cl>buf.byteLength)break;
    const p=decode(new Uint8Array(buf,o,cl),link,ol);p.t=s+u/(nano?1e9:1e6);pk.push(p);o+=cl;
  }
  return{pk,link};
}
function analyze({pk,link}){
  const n=pk.length;if(!n)throw Error('no packets found');
  let t0=Infinity,t1=-Infinity,bytes=0;const proto={},talk={},ports={},syn={},ev=[],arp={},dns={},fail={},conn={};
  for(const p of pk){if(p.t<t0)t0=p.t;if(p.t>t1)t1=p.t}
  const add=(p,sev,tag,txt)=>ev.push({t:p.t,sev,tag,txt});
  for(const p of pk){
    bytes+=p.len;proto[p.proto]=(proto[p.proto]||0)+1;
    if(p.src){const k=talk[p.src]||(talk[p.src]={p:0,b:0});k.p++;k.b+=p.len}
    if(p.dp!==undefined)ports[p.dp]=(ports[p.dp]||0)+1;
    const pair=p.src+'>'+p.dst,pl=p.pl;
    if(p.proto==='TCP'&&(p.fl&0x12)===0x02){(syn[pair]||(syn[pair]={s:new Set(),t:p.t})).s.add(p.dp);(conn[pair+':'+p.dp]||(conn[pair+':'+p.dp]=[])).push(p.t)}
    if(pl&&p.dp===21){
      let m=/^USER (.+?)\r?\n/.exec(pl);if(m)add(p,'warn','T1552 Unsecured Credentials',`${p.src} sent FTP username "${m[1]}" to ${p.dst} in cleartext`);
      m=/^PASS (.*?)\r?\n/.exec(pl);if(m)add(p,'warn','T1552 Unsecured Credentials',`${p.src} sent an FTP password (${m[1].length} characters) to ${p.dst} in cleartext`);
      m=/^RETR (.+?)\r?\n/.exec(pl);if(m)add(p,'info','',`${p.src} requested file "${m[1]}" from ${p.dst} over FTP`);
    }
    if(pl&&p.sp===21&&pl.startsWith('530')){const k=fail[p.dst+'>'+p.src]||(fail[p.dst+'>'+p.src]={n:0,t:p.t});k.n++}
    if(pl&&(p.dp===80||p.dp===8080)){const m=/Authorization: Basic (\S+)/i.exec(pl);if(m){let u='?';try{u=atob(m[1]).split(':')[0]}catch(e){}add(p,'warn','T1552 Unsecured Credentials',`${p.src} sent HTTP Basic credentials (user "${u}") to ${p.dst} unencrypted`)}}

    if(p.proto==='ARP'&&p.op===2)(arp[p.src]||(arp[p.src]={m:new Set(),t:p.t})).m.add(p.mac);
  }
  for(const[k,v]of Object.entries(syn))if(v.s.size>=20){const[a,b]=k.split('>');ev.push({t:v.t,sev:'warn',tag:'T1046 Network Service Discovery',txt:`${a} sent SYN packets to ${v.s.size} different ports on ${b} (suspected port scan)`})}
  for(const[k,v]of Object.entries(fail))if(v.n>=5){const[a,b]=k.split('>');ev.push({t:v.t,sev:'alert',tag:'T1110 Brute Force',txt:`${a} failed to log in to ${b} over FTP ${v.n} times (suspected brute force)`})}
  for(const[k,v]of Object.entries(dns))if(v.n>=10)ev.push({t:v.t,sev:'alert',tag:'T1071.004 DNS',txt:`${k} sent ${v.n} unusually long DNS queries, for example "${v.ex.slice(0,60)}" (suspected DNS tunneling)`});
  for(const[k,v]of Object.entries(arp))if(v.m.size>=2)ev.push({t:v.t,sev:'alert',tag:'T1557.002 ARP Cache Poisoning',txt:`${k} was claimed by ${v.m.size} different MAC addresses (suspected ARP spoofing)`});
  for(const[k,ts]of Object.entries(conn)){if(ts.length<8)continue;ts.sort((a,b)=>a-b);const d=ts.slice(1).map((x,i)=>x-ts[i]),m=d.reduce((a,b)=>a+b)/d.length,sd=Math.sqrt(d.reduce((a,b)=>a+(b-m)**2,0)/d.length);if(m>0.5&&sd/m<0.1)ev.push({t:ts[0],sev:'warn',tag:'T1071 Application Layer Protocol',txt:`${k.replace('>',' to ')} repeated ${ts.length} times about every ${m.toFixed(1)} s (suspected beaconing)`})}
  const dur=t1-t0,B=60,buckets=new Array(B).fill(0);
  for(const p of pk)buckets[Math.min(B-1,dur?Math.floor((p.t-t0)/dur*B):0)]++;
  ev.sort((a,b)=>a.t-b.t);const mm=new Map();for(const e of ev){e.t-=t0;const l=mm.get(e.txt);if(l)l.c++;else{e.c=1;mm.set(e.txt,e)}}
  const evs=[...mm.values()];for(const e of evs)if(e.c>1)e.txt+=' (x'+e.c+')';
  return{n,bytes,dur,link,proto,talk,ports,buckets,ev:evs};
}
//CORE-END
</script>

function go(name,buf){
  const out=$('#out');out.innerHTML='<p class="ok">analyzing...</p>';
  const w=new Worker(wurl);
  w.onmessage=e=>{w.terminate();e.data.err?out.innerHTML='<p class="warn">Could not read file: '+esc(e.data.err)+'</p>':render(e.data.ok,{name})};
  w.onerror=()=>{w.terminate();out.innerHTML='<p class="warn">Analysis failed.</p>'};
  w.postMessage(buf,[buf]);
}
async function run(f){
  if(f.size>50*1048576){$('#out').innerHTML='<p class="warn">File too large (max 50 MB).</p>';return}
  go(f.name,await f.arrayBuffer());
}
$('#demo').onclick=()=>go('demo.pcap',Uint8Array.from(atob(DEMO),c=>c.charCodeAt(0)).buffer);
const d=$('#drop'),i=$('#file');
d.onclick=()=>i.click();i.onchange=()=>i.files[0]&&run(i.files[0]);
d.ondragover=e=>{e.preventDefault();d.classList.add('on')};d.ondragleave=()=>d.classList.remove('on');
d.ondrop=e=>{e.preventDefault();d.classList.remove('on');e.dataTransfer.files[0]&&run(e.dataTransfer.files[0])};
